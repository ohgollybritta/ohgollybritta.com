<!-- ── Spotify Recently Played Widget ── -->
<!-- Drop this <script> block just before </body> in index.html -->
<!-- Update PROXY_URL to the actual path on your DreamHost server -->
<script>
(async function () {
  const PROXY_URL = '/spotify-proxy.php'; // update if you place the file in a subfolder

  function timeAgo(isoString) {
    const diffMs  = Date.now() - new Date(isoString).getTime();
    const mins    = Math.floor(diffMs / 60000);
    const hours   = Math.floor(mins / 60);
    const days    = Math.floor(hours / 24);
    if (mins  <  1)  return 'just now';
    if (mins  < 60)  return `${mins}m ago`;
    if (hours < 24)  return `${hours}h ago`;
    return `${days}d ago`;
  }

  try {
    const res  = await fetch(PROXY_URL);
    if (!res.ok) throw new Error(`Proxy returned ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    // Update the three text nodes that already exist in the card
    const trackEl  = document.getElementById('sp-track');
    const artistEl = document.getElementById('sp-artist');
    const agoEl    = document.getElementById('sp-ago');

    if (trackEl)  trackEl.textContent  = data.track;
    if (artistEl) artistEl.textContent = data.artist;
    if (agoEl)    agoEl.textContent    = timeAgo(data.played_at);

    // Make the whole card a link to the track on Spotify
    const card = document.querySelector('.card-spotify');
    if (card && data.url) {
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => window.open(data.url, '_blank'));
    }

  } catch (err) {
    console.warn('Spotify widget:', err.message);
    // Leave the mockup values in place so the card never looks broken
  }
})();
</script>
